name: Render Remotion Video

on:
  workflow_dispatch:
    inputs:
      composition_id:
        description: "ID komposisi di Root.tsx"
        required: true
        default: "AnimatedText"
      output_file:
        description: "Path file output MP4"
        required: true
        default: "out/video.mp4"

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Render video with Remotion
        run: |
          mkdir -p "$(dirname "${{ inputs.output_file }}")"
          npx remotion render src/index.ts "${{ inputs.composition_id }}" "${{ inputs.output_file }}"

      - name: Upload rendered video artifact
        uses: actions/upload-artifact@v4
        with:
          name: remotion-video
          path: ${{ inputs.output_file }}
